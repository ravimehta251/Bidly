name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/bidly

jobs:
  deploy:
    name: Deploy production stack
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ec2-deploy
            HostName $EC2_HOST
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/ec2_key
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='target' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            -czf /tmp/bidly.tar.gz .

          scp /tmp/bidly.tar.gz ec2-deploy:/tmp/bidly.tar.gz

      - name: Deploy with Docker Compose
        id: deploy
        continue-on-error: true
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          printf '%s' "$JWT_SECRET" | ssh ec2-deploy \
            "sudo install -d -o $EC2_USER -g $EC2_USER '$DEPLOY_PATH' && \
             tar -xzf /tmp/bidly.tar.gz -C '$DEPLOY_PATH' && \
             rm /tmp/bidly.tar.gz && \
             read -r JWT_SECRET && \
             printf 'JWT_SECRET=%s\\n' \"\$JWT_SECRET\" > '$DEPLOY_PATH/.env' && \
             chmod 600 '$DEPLOY_PATH/.env' && \
             install -d -m 755 ~/.docker/cli-plugins && \
             curl -fsSL https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64 \
               -o ~/.docker/cli-plugins/docker-buildx && \
             chmod 755 ~/.docker/cli-plugins/docker-buildx && \
             docker buildx version && \
             cd '$DEPLOY_PATH' && \
             docker compose up -d --build --remove-orphans --wait --wait-timeout 240 && \
             docker compose restart nginx && \
             docker image prune -f"

      - name: Verify deployment
        if: steps.deploy.outcome == 'success'
        id: healthcheck
        continue-on-error: true
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              "http://$EC2_HOST/actuator/health" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Show deployment diagnostics
        if: steps.deploy.outcome == 'failure' || steps.healthcheck.outcome == 'failure'
        run: |
          ssh ec2-deploy \
            "cd '$DEPLOY_PATH' && docker compose ps --all && docker compose logs --tail=150"
          exit 1
