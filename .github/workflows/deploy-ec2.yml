name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bidly-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Bidly
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" > ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host bidly-ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/ec2_key
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Package application
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          JWT_SECRET_BYTES=$(printf '%s' "$JWT_SECRET" | wc -c)
          if [ "$JWT_SECRET_BYTES" -lt 32 ]; then
            echo "::error::JWT_SECRET must contain at least 32 bytes for HS256 (current length: $JWT_SECRET_BYTES)."
            exit 1
          fi

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='target' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            -czf /tmp/bidly.tar.gz .

          printf 'JWT_SECRET=%s\n' "$JWT_SECRET" > /tmp/bidly.env
          chmod 600 /tmp/bidly.env

      - name: Upload application
        run: |
          scp /tmp/bidly.tar.gz bidly-ec2:/tmp/bidly.tar.gz
          scp /tmp/bidly.env bidly-ec2:/tmp/bidly.env

      - name: Deploy application
        run: |
          ssh bidly-ec2 'bash -s -- /opt/bidly' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          DEPLOY_PATH="$1"

          show_diagnostics() {
            exit_code=$?
            echo "::group::Docker Compose status"
            docker compose -f "$DEPLOY_PATH/docker-compose.yml" ps --all || true
            echo "::endgroup::"
            echo "::group::Backend logs"
            docker compose -f "$DEPLOY_PATH/docker-compose.yml" logs --no-color --tail=200 app-2 || true
            echo "::endgroup::"
            exit "$exit_code"
          }
          trap show_diagnostics ERR

          sudo install -d -o "$(id -un)" -g "$(id -gn)" "$DEPLOY_PATH"
          tar -xzf /tmp/bidly.tar.gz -C "$DEPLOY_PATH"
          install -m 600 /tmp/bidly.env "$DEPLOY_PATH/.env"
          rm -f /tmp/bidly.tar.gz /tmp/bidly.env

          install -d -m 755 "$HOME/.docker/cli-plugins"
          curl -fsSL \
            https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64 \
            -o "$HOME/.docker/cli-plugins/docker-buildx"
          chmod 755 "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version

          cd "$DEPLOY_PATH"
          docker compose config --quiet
          docker compose up -d --build --remove-orphans --wait --wait-timeout 240
          docker compose restart nginx
          docker image prune -f
          REMOTE_SCRIPT

      - name: Verify public health endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              "http://$EC2_HOST/actuator/health" >/dev/null; then
              echo "Bidly is healthy"
              exit 0
            fi
            sleep 5
          done

          echo "Public health check failed"
          ssh bidly-ec2 \
            'cd /opt/bidly && docker compose ps --all && docker compose logs --no-color --tail=200 app-2 nginx'
          exit 1
