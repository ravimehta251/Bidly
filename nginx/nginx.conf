worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream bidly_backend {
        # Single backend instance for the local deployment.
        server app-2:8080;
    }


    upstream bidly_frontend {
        server frontend:80;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep API, actuator, Swagger, and SockJS/STOMP traffic on the backend.
        location /api/ {
            proxy_pass http://bidly_backend;
        }

        location /actuator/ {
            proxy_pass http://bidly_backend;
        }

        location /swagger-ui/ {
            proxy_pass http://bidly_backend;
        }

        location = /swagger-ui.html {
            proxy_pass http://bidly_backend;
        }

        location /v3/api-docs/ {
            proxy_pass http://bidly_backend;
        }

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://bidly_backend;
        }

                # Everything else is the React SPA; the frontend Nginx supplies the
        # index.html fallback for BrowserRouter routes.
        location / {
            proxy_pass http://bidly_frontend;
    }
}


}
