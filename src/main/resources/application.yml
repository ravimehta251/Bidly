spring:
  application:
    name: bidflare

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bidflare}
    username: ${DB_USER:bidflare}
    password: ${DB_PASS:bidflare}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — never let JPA touch it
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          password: ${REDIS_PASSWORD:}
          connectionMinimumIdleSize: 2
          connectionPoolSize: 10
          idleConnectionTimeout: 10000
          connectTimeout: 3000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

# JWT
jwt:
  secret: ${JWT_SECRET:changeme-replace-in-production-min-32-chars!!}
  expiration-ms: ${JWT_EXPIRY_MS:86400000}   # 24 h

# Auction settings
auction:
  anti-snipe-window-seconds: 60
  anti-snipe-extension-seconds: 60
  min-increment-default: 1.00

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
